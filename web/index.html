<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="HomeBuild Pro" />
    <!-- Single theme-color, kept in sync with the RESOLVED theme (incl. user-forced
         light/dark that differs from the OS) by the inline script below + applyTheme(). -->
    <meta name="theme-color" content="#08080a" />
    <title>HomeBuild Pro</title>
    <script>
      // Set the resolved theme before first paint to avoid a flash.
      (function () {
        try {
          var pref = localStorage.getItem('btp.theme') || 'system'
          var dark =
            pref === 'dark' ||
            (pref === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#08080a' : '#f2f2f7')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
